<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    path { stroke: #000; }
    @media (prefers-color-scheme: dark) {
      path { stroke: #fff; }
    }
  </style>
  <!-- "AL" monogram in thin strokes, echoing the light, wide Archivo display
       type. No tile: the ink sits directly on the tab and inverts in dark
       mode, like the site's ink/paper palette. -->
  <path d="M4 52 L18 12 L32 52 M8.9 38 H27.1 M40 12 V52 H60" fill="none" stroke-width="4" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="10" />
</svg>
